name: Code Style

on:
  pull_request:

concurrency:
  group: codestyle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff check
        run: ruff check .

      - name: Run Ruff format check
        run: ruff format --check .

      - name: Requirements copies match
        # The root copy is what Odoo.sh installs (it looks in the folder that
        # *contains* the modules, not in the module itself). The in-module copy
        # ships inside the App Store archive. They must stay identical.
        run: diff requirements.txt payment_buckaroo_official/requirements.txt
